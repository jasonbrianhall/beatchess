name: Build Beatchess 

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

env:
  PRODUCT_VERSION: "1.0.${{ github.run_number }}"

jobs:
  build-msdos:
    runs-on: ubuntu-latest
    container: 
      image: djfdyuruiry/djgpp
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        apt-get update
        apt-get install -y wget unzip zip

    - name: Download CSDPMI
      run: |
        wget http://na.mirror.garr.it/mirrors/djgpp/current/v2misc/csdpmi7b.zip
        unzip -o csdpmi7b.zip -d csdpmi

    - name: Build MS-DOS Version
      run: |
        make -f Makefile.dosenv
        
    - name: Create MS-DOS Distribution
      run: |
        mkdir beatchess-msdos-v1.0
        cp build/dos/*.exe beatchess-msdos-v1.0/
        
        echo "Beatchess for MS-DOS
        Version 1.0

        Installation:
        1. dosbox beatchess.exe

        Requirements:
        - MS-DOS or compatible OS
        - 4MB RAM
        - VGA or better graphics" > beatchess-msdos-v1.0/README-MSDOS.txt
        
        zip -r ../beatchess-msdos.zip beatchess-msdos-v1.0

    - name: Upload MS-DOS Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: msdos-artifacts
        path: |
          beatchess-msdos.zip

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: beatchess-windows
        path: release-artifacts/

  create-release:
    needs: [build-msdos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Download MSDOS Artifact
      uses: actions/download-artifact@v4
      with:
        name: msdos-artifacts
        path: release

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          release/beatchess-msdos.zip
        tag_name: ${{ github.ref == 'refs/heads/main' && format('v{0}', github.run_number) || format('dev-v{0}', github.run_number) }}
        name: ${{ github.ref == 'refs/heads/main' && format('Release {0}', github.run_number) || format('Dev Build {0}', github.run_number) }}
        draft: false
        prerelease: ${{ github.ref != 'refs/heads/main' }}
        body: |
          **Build:** #${{ github.run_number }}
                    
          Built with GitHub Actions
